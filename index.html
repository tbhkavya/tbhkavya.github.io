<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kavya Singhal | XR Developer</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #070709;
            color: #f5f4ef;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }


        /* =====================================================
           INTRO SCREEN
        ===================================================== */

        #intro {

            position: fixed;

            inset: 0;

            z-index: 9999;

            background: #070709;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;
        }


        /* =====================================================
           INTRO NAME
        ===================================================== */

        .intro-name {

            position: relative;

            width: 100%;

            height: 130px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: clamp(
                45px,
                8vw,
                125px
            );

            font-weight: 700;

            letter-spacing: -5px;

            line-height: 1;

            opacity: 0;

            transform: scale(.96);

            animation:
                introAppear
                .55s
                ease
                forwards;
        }


        @keyframes introAppear {

            from {
                opacity: 0;
                transform: scale(.96);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }


        /* =====================================================
           NAME HALVES
        ===================================================== */

        .name-half {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

        }


        /*
            Upper half of the letters
        */

        .name-top {

            clip-path:
                inset(
                    0
                    0
                    50%
                    0
                );

        }


        /*
            Lower half of the letters
        */

        .name-bottom {

            clip-path:
                inset(
                    50%
                    0
                    0
                    0
                );

        }


        /*
            Both copies are positioned
            at exactly the same location.
        */

        .name-half span {

            position: absolute;

            left: 50%;

            top: 50%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            white-space: nowrap;

        }


        /* =====================================================
           SPLIT ANIMATION
        ===================================================== */

        .name-top {

            transition:
                transform
                .65s
                cubic-bezier(
                    .76,
                    0,
                    .24,
                    1
                );

        }


        .name-bottom {

            transition:
                transform
                .65s
                cubic-bezier(
                    .76,
                    0,
                    .24,
                    1
                );

        }


        /*
            Upper part leaves upward.
        */

        #intro.split .name-top {

            transform:
                translateY(-100vh);

        }


        /*
            Lower part leaves downward.
        */

        #intro.split .name-bottom {

            transform:
                translateY(100vh);

        }


        /*
            Remove intro after animation.
        */

        #intro.hide {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transition:
                opacity
                .25s
                ease;

        }


        /* =====================================================
           MAIN WEBSITE
        ===================================================== */

        #website {

            opacity: 0;

            transition:
                opacity
                .7s
                ease;

        }


        #website.visible {

            opacity: 1;

        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        nav {

            height: 88px;

            padding:
                0 6vw;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border-bottom:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .08
                );

        }


        .logo {

            color: white;

            text-decoration: none;

            font-size: 25px;

            font-weight: 700;

        }


        .logo span {

            color: #9b7cff;

        }


        .nav-links {

            display: flex;

            gap: 35px;

        }


        .nav-links a {

            color: #888;

            text-decoration: none;

            font-size: 14px;

            transition:
                color
                .2s
                ease;

        }


        .nav-links a:hover {

            color: white;

        }


        .resume {

            color: white;

            text-decoration: none;

            border:
                1px solid
                #303035;

            padding:
                10px 17px;

            border-radius:
                30px;

            font-size: 13px;

        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {

            min-height:
                calc(
                    100vh - 88px
                );

            padding:
                5vw 6vw;

            display: grid;

            grid-template-columns:
                1.05fr
                .95fr;

            align-items: center;

            gap:
                50px;

        }


        /* =====================================================
           HERO TEXT
        ===================================================== */

        .hero-text {

            position: relative;

            z-index: 5;

        }


        .kicker {

            color: #62d8ff;

            font-family: monospace;

            font-size: 11px;

            letter-spacing: 3px;

            margin-bottom: 25px;

        }


        .hero h1 {

            font-size:
                clamp(
                    55px,
                    7.5vw,
                    115px
                );

            line-height: .88;

            letter-spacing: -6px;

            font-weight: 700;

        }


        .outline {

            color: transparent;

            -webkit-text-stroke:
                1px
                rgba(
                    255,
                    255,
                    255,
                    .65
                );

        }


        .description {

            max-width: 540px;

            margin-top: 35px;

            color: #999;

            font-size: 17px;

            line-height: 1.7;

        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .buttons {

            display: flex;

            gap: 12px;

            margin-top: 35px;

        }


        .button {

            text-decoration: none;

            padding:
                15px 21px;

            border-radius: 30px;

            font-size: 14px;

        }


        .primary {

            background: #f5f4ef;

            color: #08080a;

        }


        .secondary {

            color: white;

            border:
                1px solid
                #303035;

        }


        /* =====================================================
           PHOTO AREA
        ===================================================== */

        .photo-area {

            height: 650px;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        /* =====================================================
           PHOTO GLOW
        ===================================================== */

        .photo-glow {

            position: absolute;

            width: 360px;

            height: 360px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(
                        155,
                        124,
                        255,
                        .35
                    ),
                    transparent 70%
                );

            filter: blur(45px);

            z-index: 1;

        }


        /* =====================================================
           PHOTO
        ===================================================== */

        .photo-frame {

            position: relative;

            z-index: 5;

            width:
                min(
                    370px,
                    72%
                );

            height: 500px;

            overflow: hidden;

            border-radius:
                190px
                190px
                25px
                25px;

            background: #15151a;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .12
                );

            box-shadow:
                0
                30px
                100px
                rgba(
                    0,
                    0,
                    0,
                    .6
                );

        }


        .photo-frame img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

        }


        /* =====================================================
           NEXT SECTION
           
           EMPTY FOR NOW.
           
           We will design this after you tell me
           exactly what you want here.
        ===================================================== */

        .section {

            min-height: 80vh;

            padding:
                120px 6vw;

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .08
                );

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media(max-width: 850px) {


            .nav-links {

                display: none;

            }


            .hero {

                grid-template-columns: 1fr;

                padding:
                    70px 6vw;

            }


            .photo-area {

                height: 550px;

            }


            .photo-frame {

                width: 300px;

                height: 420px;

            }


            .intro-name {

                font-size: 12vw;

                letter-spacing:
                    -2px;

            }

        }

    </style>

</head>


<body>


    <!-- =================================================
         OPENING ANIMATION
    ================================================= -->

    <div id="intro">

        <div class="intro-name">


            <!-- TOP HALF -->

            <div class="name-half name-top">

                <span>

                </span>

            </div>


            <!-- BOTTOM HALF -->

            <div class="name-half name-bottom">

                <span>
                    KAVYA SINGHAL
                </span>

            </div>


        </div>

    </div>



    <!-- =================================================

    ================================================= -->

    <div id="website">


        <!-- NAVIGATION -->

        <nav>


            <a

            <div class="nav-links">

                <a href="#work">

                </a>

            </div>


            <a

        </nav>



        <!-- =================================================

        ================================================= -->

        <section class="hero">


            <!-- LEFT SIDE -->

            <div class="hero-text">


                <div class="kicker">

                </div>

            <!-- RIGHT SIDE -->

            <div class="photo-area">

                    <img

        <!-- =================================================
             NEXT SECTION

        ================================================= -->

        <section

        >

        </section>



        <!-- =================================================

             EMPTY FOR NOW
        ================================================= -->

        <section
            class="section"

        >

        </section>



        <!-- =================================================
             CONTACT
             
             EMPTY FOR NOW
        ================================================= -->

        <section
            class="section"
            id="contact"
        >

        </section>


    </div>



    <!-- =================================================
         INTRO ANIMATION SCRIPT
    ================================================= -->

    <script>

        window.addEventListener(
            "load",
            function() {


                const intro =
                    document.getElementById(
                        "intro"
                    );


                const website =
                    document.getElementById(
                        "website"
                    );


                /*
                    Name appears first.
                */


                setTimeout(
                    function() {

                        /*
                            Split the name.

                            Top half:
                            moves UP

                            Bottom half:
                            moves DOWN
                        */

                        intro.classList.add(
                            "split"
                        );


                        /*
                            Reveal the website
                            at the same time.
                        */

                        website.classList.add(
                            "visible"
                        );

                    },
                    850
                );


                /*
                    Completely remove
                    the intro after the
                    split animation.
                */

                setTimeout(
                    function() {

                        intro.classList.add(
                            "hide"
                        );

                    },
                    1650
                );


            }
        );

    </script>


</body>

</html>
